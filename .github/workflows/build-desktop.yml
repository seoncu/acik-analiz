name: Masaüstü uygulama derle (.app / .exe)

# Tek dosya, çift-tıkla çalışan masaüstü uygulaması üretir (Python kurulumu GEREKTİRMEZ).
# Tetikleme: elle (Actions sekmesi → Run workflow) veya v* etiketi push'u.
#
# ÖN KOŞUL: Bu deponun kök dizininde server/engine.py ve server/requirements.txt bulunmalı.
# (Şu an depoda yoklar — eklenince bu workflow çalışır hale gelir.)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Derle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: AcikAnaliz-macOS
            sep: ":"
          - os: windows-latest
            artifact: AcikAnaliz-Windows
            sep: ";"
    steps:
      - uses: actions/checkout@v4

      - name: server/ var mı kontrol et
        shell: bash
        run: |
          if [ ! -f server/engine.py ]; then
            echo "::error::server/engine.py bulunamadı. Bu workflow'un çalışması için server/ klasörünü (engine.py + requirements.txt) depoya ekleyin."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi

      - name: PyInstaller ile derle
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name AcikAnaliz \
            --add-data "server${{ matrix.sep }}server" \
            --collect-all polars \
            --collect-all scipy \
            --collect-all numpy \
            --collect-submodules uvicorn \
            --collect-submodules fastapi \
            desktop/launcher.py

      - name: Çıktıyı paketle
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            # .app paketini zip'le (Gatekeeper kotasını korumak için ditto)
            ditto -c -k --sequesterRsrc --keepParent "dist/AcikAnaliz.app" "out/${{ matrix.artifact }}.zip"
          else
            cp dist/AcikAnaliz.exe "out/AcikAnaliz.exe"
          fi

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    name: Sürüm oluştur
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
